name: CI

# Runs on every pull request into main. Verifies the code WITHOUT deploying:
#   - backend unit/integration tests (node:test)
#   - both Docker images build cleanly
# Nothing here touches GCP or any secret — unreviewed PR code never deploys.

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build both images to catch Dockerfile/dependency breakage before merge.
      # We don't push them — this is a compile-check, not a deploy.
      - name: Build backend image
        run: docker build -t rf-backend-check ./backend

      - name: Build frontend image
        run: docker build -t rf-frontend-check ./frontend
