name: CI/CD Pipeline

# One gated pipeline.
#
#   Pull request → main : run unit tests + CodeQL + Docker build. No deploy.
#   Push to main (merge): re-run all three checks, then deploy to Cloud Run
#                         ONLY if every check passes (the deploy job `needs`
#                         them). Deploy is further guarded to the push event so
#                         it never runs on a PR — and never on a fork PR, where
#                         the WIF repo variables aren't available.
#   Push to develop-dev : run the fast functional gates (test + docker-build +
#                         frontend-smoke), then deploy to the DEVELOPMENT
#                         project (root-and-fruit-dev) via the `deploy-dev` job.
#                         The heavy security gates (CodeQL, dependency audit)
#                         are scoped to the PR→main boundary, not every dev
#                         push. Prod is never reachable from this branch.
#
# Auth is keyless via Workload Identity Federation. App secrets live in GCP
# Secret Manager (attached with --set-secrets); nothing secret is stored in
# GitHub. Config comes from repo VARIABLES (Settings → Secrets and variables →
# Actions → Variables): GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER,
# GCP_DEPLOY_SA (+ optional ANTHROPIC_MODEL, REGISTRATION_EMAIL,
# REGISTRATION_FROM, DONATION_URL, ALLOWED_ORIGIN).

# Branch → dev, main → prod:
#
#   push ANY non-main branch : gates (test, CodeQL, docker-build, audit,
#                       frontend-smoke) → build image once → deploy to the
#                       DEVELOPMENT environment. The Billion Godson regression is
#                       OPT-IN — it runs only when the commit message contains
#                       `[regression]`.
#   push main (merge)        : gates → MANUAL APPROVAL (production Environment
#                       protection) → PROMOTE the exact image the branch built +
#                       validated in dev (build-once-promote) → post-deploy smoke
#                       → AUTO-ROLLBACK on failure.
#   pull_request → main      : gates only (PR checks).
#   workflow_dispatch        : manual rollback path (rollback job only).
#
# NOTE: every non-main branch deploys to the ONE shared dev environment, so two
# branches deploying at once overwrite each other (last push wins).
on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      service:
        description: Service to roll back
        type: choice
        options: [backend, frontend, both]
        default: both
      revision:
        description: Target revision name (blank = previous ready revision). Requires a single service.
        required: false
        default: ''

# Cancel superseded PR and feature-branch runs; serialize (don't cancel) runs on
# main so a prod deploy is never interrupted mid-flight.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

# Cloud Run service names. Changing one creates a NEW service on the next
# deploy — the old one keeps running (and billing) until deleted manually.
#
# Build-once-promote: images are built ONCE (on a develop-dev push), pushed to a
# SHARED Artifact Registry repo in the prod project, validated in dev, and the
# SAME image is promoted to prod — so the bytes tested in dev are the bytes that
# ship. IMAGE_PROJECT hosts the shared repo (constant across environments, unlike
# GCP_PROJECT_ID which the development Environment overrides). Both projects'
# Cloud Run service agents have artifactregistry.reader on this repo (cross-
# project pull) — see scripts/bootstrap-env.sh.
env:
  BACKEND_SERVICE: root-and-fruit-backend
  FRONTEND_SERVICE: root-and-fruit-frontend
  IMAGE_PROJECT: root-and-fruit-app
  IMAGE_REPO: rf-images

jobs:
  # ── Gate 1: unit/integration tests ──────────────────────────────────────
  # Backend only — the frontend is a single static HTML file with no build
  # step and currently no test suite (see recommendations in the repo docs).
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  # ── Gate 2: CodeQL static analysis ──────────────────────────────────────
  # Scans all JS/TS in the repo — backend/server.js, frontend/server.js, and
  # the inline <script> in frontend/public/index.html. Findings surface in the
  # Security tab and as a PR check (security-events: write is required).
  # Runs the `security-and-quality` suite: default CodeQL is security-only, so
  # this is what adds the maintainability / quality queries. NOTE: if repo
  # Settings → Code security has "Default setup" enabled, it overrides this
  # workflow and its uploads are ignored — disable default setup so this job
  # owns code scanning.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Runs on every branch push + PR (a gate for the dev deploy and the prod merge).
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ── Gate 3: images build AND start ──────────────────────────────────────
  # Builds each image, then RUNS the container and health-checks it. A build
  # alone is only a compile check — it does NOT catch a file that's missing at
  # runtime (e.g. a Dockerfile that forgets to COPY a required dir), which fails
  # only when `node server.js` starts. Running + curling the liveness endpoint
  # catches that class of bug here instead of on the Cloud Run deploy. Images are
  # built locally and never pushed, so no registry login is needed.
  docker-build:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t rf-backend-check ./backend
      # /health is credential-free and the Firestore client is lazy, so the
      # backend boots and serves with no secrets — a clean liveness probe.
      - name: Backend container starts and serves /health
        run: |
          docker run -d --name rf-backend -p 8080:8080 rf-backend-check
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::backend container failed to serve /health"; docker logs rf-backend || true; fi
          docker rm -f rf-backend >/dev/null 2>&1 || true
          [ "$ok" = "1" ]

      - name: Build frontend image
        run: docker build -t rf-frontend-check ./frontend
      - name: Frontend container starts and serves /
        run: |
          docker run -d --name rf-frontend -p 8081:8080 -e BACKEND_URL=http://backend.invalid rf-frontend-check
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8081/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::frontend container failed to serve /"; docker logs rf-frontend || true; fi
          docker rm -f rf-frontend >/dev/null 2>&1 || true
          [ "$ok" = "1" ]

  # ── Gate 4: backend dependency audit ────────────────────────────────────
  # CodeQL scans our own code; this scans the dependency tree for known CVEs.
  # Gated at `critical` so it doesn't block on the pre-existing HIGH advisory in
  # the @google-cloud/firestore → teeny-request → uuid chain (transitive; not
  # directly fixable without a firestore bump). Once that chain is addressed
  # (npm audit fix, a firestore upgrade, or a package.json `overrides` for uuid),
  # tighten to `--audit-level=high`. To make it non-blocking instead, add
  # `continue-on-error: true` to the audit step or drop this job from deploy.needs.
  audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    # Runs on every branch push + PR (a gate for the dev deploy and the prod merge).
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=critical

  # ── Gate 5: frontend smoke test ─────────────────────────────────────────
  # The frontend has no build step, so a JS bug in the single-file app ships
  # silently. This boots frontend/server.js and drives every nav tab in headless
  # Chromium — catching uncaught errors, missing runtime-config injection, and
  # nav/tabs-array drift (the dead-showView hazard). See frontend/test/smoke.mjs.
  frontend-smoke:
    name: Frontend smoke test
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # Playwright is a CI-only concern — installed ad-hoc with --no-save so it
      # never lands in the frontend's committed dependency set.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm i -D --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run smoke test
        working-directory: frontend
        run: node test/smoke.mjs

  # ── Build once: push SHA-tagged images to the shared registry ───────────
  # Runs on a push to any non-main branch (after the gates). Builds both images
  # on the runner and pushes them to the SHARED Artifact Registry repo tagged by
  # commit SHA. deploy-dev then deploys these exact images, and — because merging
  # the branch → main is a merge commit — the prod deploy promotes the very same
  # SHA-tagged image (the merge's second parent). One build, validated in dev,
  # shipped to prod. Auth uses the shared deploy SA (artifactregistry.admin on
  # the image project), so no environment override is needed here.
  build-images:
    name: Build + push images
    needs: [test, docker-build, frontend-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.IMAGE_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push both images (tagged sha-<commit>)
        run: |
          REG="${{ vars.GCP_REGION }}-docker.pkg.dev/${IMAGE_PROJECT}/${IMAGE_REPO}"
          TAG="sha-${{ github.sha }}"
          docker build -t "$REG/backend:$TAG"  ./backend
          docker push    "$REG/backend:$TAG"
          docker build -t "$REG/frontend:$TAG" ./frontend
          docker push    "$REG/frontend:$TAG"
          {
            echo "### Images built + pushed :package:"
            echo "- \`$REG/backend:$TAG\`"
            echo "- \`$REG/frontend:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy: only after all gates pass, only on a merge to main ──────────
  # `environment: production` is what enforces the MANUAL APPROVAL gate: add a
  # required-reviewer protection rule to the production Environment in GitHub
  # (Settings → Environments → production) and this job pauses for a human click
  # before any step runs. GCP_PROJECT_ID has no production-scoped override, so it
  # falls back to the repo-level value (root-and-fruit-app) — prod stays prod.
  deploy:
    name: Deploy to Cloud Run
    needs: [test, codeql, docker-build, audit, frontend-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.frontend.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read       # checkout
      id-token: write       # required for Workload Identity Federation
    steps:
      # Full history so `git rev-parse HEAD^2` resolves the merge's second
      # parent — the develop-dev commit whose image was built + validated in dev.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fail early with a readable message if the repo variables are missing —
      # otherwise the auth action errors with a cryptic "must specify exactly
      # one of workload_identity_provider or credentials_json".
      - name: Verify deploy configuration is present
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID repo variable (Settings → Secrets and variables → Actions → Variables)}"
          : "${GCP_REGION:?Set the GCP_REGION repo variable}"
          : "${GCP_WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repo variable}"
          : "${GCP_DEPLOY_SA:?Set the GCP_DEPLOY_SA repo variable}"
          echo "Deploy config present."

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Build-once-promote: prefer the image dev already built + validated. The
      # merge commit's second parent (HEAD^2) is the develop-dev tip that ran
      # through deploy-dev + the Billion Godson regression; if its SHA-tagged
      # image exists in the shared repo, promote THOSE exact bytes (no rebuild).
      # Fall back to a fresh --source build for a direct push to main or a
      # squash-merge / missing image (no usable second parent).
      - name: Resolve promotion image
        id: img
        run: |
          REG="${{ vars.GCP_REGION }}-docker.pkg.dev/${IMAGE_PROJECT}/${IMAGE_REPO}"
          DEV_SHA="$(git rev-parse HEAD^2 2>/dev/null || true)"
          if [ -n "$DEV_SHA" ] \
             && gcloud artifacts docker images describe "$REG/backend:sha-$DEV_SHA"  --project "$IMAGE_PROJECT" >/dev/null 2>&1 \
             && gcloud artifacts docker images describe "$REG/frontend:sha-$DEV_SHA" --project "$IMAGE_PROJECT" >/dev/null 2>&1; then
            {
              echo "promote=true"
              echo "backend_image=$REG/backend:sha-$DEV_SHA"
              echo "frontend_image=$REG/frontend:sha-$DEV_SHA"
              echo "src_sha=$DEV_SHA"
            } >> "$GITHUB_OUTPUT"
            echo "Promoting dev-validated image sha-$DEV_SHA (no rebuild)"
            echo "- Promoting **dev-validated** image \`sha-$DEV_SHA\` (no rebuild)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "No matching pre-built image — falling back to --source build."
            echo "- No pre-built image for the merged commit — **building from source** (fallback)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Record the revision each service is serving BEFORE we overwrite it, so
      # both the auto-rollback step below and the manual rollback (workflow_
      # dispatch) have a known-good target on file. Captured as step outputs.
      # Empty on first deploy, when the services don't exist yet.
      - name: Record current (pre-deploy) revisions
        id: prerev
        run: |
          for svc in "$BACKEND_SERVICE" "$FRONTEND_SERVICE"; do
            rev=$(gcloud run services describe "$svc" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --format 'value(status.traffic[0].revisionName)' 2>/dev/null || true)
            key=$([ "$svc" = "$BACKEND_SERVICE" ] && echo backend_prev || echo frontend_prev)
            echo "${key}=${rev}" >> "$GITHUB_OUTPUT"
            echo "- **$svc** was serving: \`${rev:-none (first deploy)}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # ── Backend first (frontend depends on its URL) ──────────────────────
      # Promote the dev-validated image when available (--image), else build
      # from source (--source, the original path). Secrets are attached by
      # reference (--set-secrets) so their values never pass through this
      # workflow. --timeout 600 matches the documented long-running AI request
      # budget. Optional env vars are appended only when the repo variable is set
      # — unset variables fall back to the app's built-in defaults. (The IDE
      # "Context access might be invalid" warnings on this line are the linter
      # not knowing these optional repo variables; they are safe to ignore.)
      - name: Deploy backend
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            ${{ steps.img.outputs.promote == 'true' && format('--image {0}', steps.img.outputs.backend_image) || '--source ./backend' }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 600Mi \
            --max-instances 10 \
            --timeout 600 \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,RESEND_API_KEY=resend-api-key:latest" \
            --set-env-vars "NODE_ENV=production${{ vars.ANTHROPIC_MODEL && format(',ANTHROPIC_MODEL={0}', vars.ANTHROPIC_MODEL) || '' }}${{ vars.REGISTRATION_EMAIL && format(',REGISTRATION_EMAIL={0}', vars.REGISTRATION_EMAIL) || '' }}${{ vars.REGISTRATION_FROM && format(',REGISTRATION_FROM={0}', vars.REGISTRATION_FROM) || '' }}${{ vars.DONATION_URL && format(',DONATION_URL={0}', vars.DONATION_URL) || '' }}${{ vars.ALLOWED_ORIGIN && format(',ALLOWED_ORIGIN={0}', vars.ALLOWED_ORIGIN) || '' }}"

      # Read the backend's public URL back so the frontend deploy can inject
      # it as BACKEND_URL — this ordering is the hard constraint that prevents
      # parallelizing the two deploys.
      - name: Capture backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "Backend deployed at $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # ── Frontend with BACKEND_URL wired to the backend we just deployed ──
      # BACKEND_URL is read at request time by frontend/server.js and injected
      # into HTML as window.__RF_CONFIG__ — it is runtime config, not baked
      # into the image. APP_VERSION=<commit sha> makes deploys traceable from
      # the browser (__RF_CONFIG__.version).
      - name: Deploy frontend
        id: frontend
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            ${{ steps.img.outputs.promote == 'true' && format('--image {0}', steps.img.outputs.frontend_image) || '--source ./frontend' }} \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production,BACKEND_URL=${{ steps.backend.outputs.url }},APP_VERSION=${{ github.sha }}"
          URL=$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Fail the deploy if the live services don't actually answer — otherwise a
      # broken container reports green. `curl -f` returns non-zero on HTTP 4xx/5xx;
      # a short retry loop absorbs Cloud Run cold-start latency on the new revision.
      - name: Post-deploy smoke test
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 20 "$url" > /dev/null; then
                echo "✓ $name OK ($url)"
                return 0
              fi
              echo "… $name not ready (attempt $attempt), retrying in 10s"
              sleep 10
            done
            echo "✗ $name failed health check: $url"
            return 1
          }
          probe "backend /health"  "${{ steps.backend.outputs.url }}/health"
          probe "frontend /"       "${{ steps.frontend.outputs.url }}/"

      # Auto-rollback: if ANY step above failed (a deploy error or a failed
      # post-deploy smoke test), restore 100% traffic to the revision each
      # service served before this run — captured in `prerev`. A `gcloud run
      # deploy` shifts all traffic to the new revision immediately, so without
      # this a bad-but-parseable revision would keep serving prod. Skipped for a
      # service with no prior revision (first deploy — nothing to roll back to).
      - name: Auto-rollback on failure
        if: failure()
        run: |
          restore() {
            local svc="$1" prev="$2"
            if [ -z "$prev" ]; then
              echo "::warning::$svc has no prior revision (first deploy) — cannot auto-rollback"
              return 0
            fi
            echo "Rolling $svc back to $prev"
            gcloud run services update-traffic "$svc" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --to-revisions "$prev=100"
            echo "- **$svc** auto-rolled back to \`$prev\`" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### :warning: Deploy failed — auto-rolling back" >> "$GITHUB_STEP_SUMMARY"
          restore "$BACKEND_SERVICE"  "${{ steps.prerev.outputs.backend_prev }}"
          restore "$FRONTEND_SERVICE" "${{ steps.prerev.outputs.frontend_prev }}"

      - name: Summary
        run: |
          {
            echo "### Deploy complete :rocket:"
            echo ""
            echo "- **Backend:** ${{ steps.backend.outputs.url }}"
            echo "- **Frontend:** ${{ steps.frontend.outputs.url }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            if [ "${{ steps.img.outputs.promote }}" = "true" ]; then
              echo "- **Image:** promoted dev-validated \`sha-${{ steps.img.outputs.src_sha }}\` (no rebuild)"
            else
              echo "- **Image:** built from source (no pre-built image for this commit)"
            fi
            echo "- Health checks passed for /health and /."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Deploy to DEVELOPMENT: on a push to ANY non-main branch ──────────────
  # A trimmed mirror of the prod `deploy` job that targets the separate
  # root-and-fruit-dev project. The ONLY per-environment difference is
  # GCP_PROJECT_ID, supplied by the GitHub `development` Environment
  # (Settings → Environments → development → Variables → GCP_PROJECT_ID=
  # root-and-fruit-dev). Region, WIF provider, and deploy SA are shared repo
  # variables — the SA lives in prod but was granted cross-project deploy roles
  # on the dev project (see scripts/bootstrap-env.sh). Because dev is a SEPARATE
  # project, the service names can match prod with no collision.
  #
  # Any environment-scoped variable set on `development` (e.g. a dev-specific
  # ALLOWED_ORIGIN) overrides the repo-level value for this job only — that is
  # how you give dev its own CORS origin without touching prod's.
  deploy-dev:
    name: Deploy to Cloud Run (development)
    needs: [test, docker-build, frontend-smoke, build-images]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read       # checkout
      id-token: write       # required for Workload Identity Federation
    # Exposed so the `regression` job can point the browser at the live dev app.
    outputs:
      frontend_url: ${{ steps.frontend.outputs.url }}
      backend_url: ${{ steps.backend.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify deploy configuration is present
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          : "${GCP_PROJECT_ID:?Set GCP_PROJECT_ID on the development Environment (Settings → Environments → development → Variables)}"
          : "${GCP_REGION:?Set the GCP_REGION repo variable}"
          : "${GCP_WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repo variable}"
          : "${GCP_DEPLOY_SA:?Set the GCP_DEPLOY_SA repo variable}"
          echo "Deploying to $GCP_PROJECT_ID"

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      # Backend first (frontend needs its URL). Deploys the EXACT image
      # build-images pushed for this commit (--image, not --source) — dev
      # validates the same bytes prod will promote. The image lives in the shared
      # repo (IMAGE_PROJECT); dev's Cloud Run service agent pulls it cross-project.
      # Secrets resolve against the DEV project (where this deploys).
      - name: Deploy backend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${IMAGE_PROJECT}/${IMAGE_REPO}/backend:sha-${{ github.sha }}"
          gcloud run deploy "$BACKEND_SERVICE" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 600Mi \
            --max-instances 10 \
            --timeout 600 \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,RESEND_API_KEY=resend-api-key:latest" \
            --set-env-vars "NODE_ENV=production${{ vars.ANTHROPIC_MODEL && format(',ANTHROPIC_MODEL={0}', vars.ANTHROPIC_MODEL) || '' }}${{ vars.REGISTRATION_EMAIL && format(',REGISTRATION_EMAIL={0}', vars.REGISTRATION_EMAIL) || '' }}${{ vars.REGISTRATION_FROM && format(',REGISTRATION_FROM={0}', vars.REGISTRATION_FROM) || '' }}${{ vars.DONATION_URL && format(',DONATION_URL={0}', vars.DONATION_URL) || '' }}${{ vars.ALLOWED_ORIGIN && format(',ALLOWED_ORIGIN={0}', vars.ALLOWED_ORIGIN) || '' }}"

      - name: Capture backend URL
        id: backend
        run: |
          URL=$(gcloud run services describe "$BACKEND_SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "Backend deployed at $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        id: frontend
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${IMAGE_PROJECT}/${IMAGE_REPO}/frontend:sha-${{ github.sha }}"
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image "$IMAGE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --max-instances 5 \
            --set-env-vars "NODE_ENV=production,BACKEND_URL=${{ steps.backend.outputs.url }},APP_VERSION=${{ github.sha }}"
          URL=$(gcloud run services describe "$FRONTEND_SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        run: |
          probe() {
            local name="$1" url="$2"
            for attempt in 1 2 3 4 5; do
              if curl -fsS --max-time 20 "$url" > /dev/null; then
                echo "✓ $name OK ($url)"
                return 0
              fi
              echo "… $name not ready (attempt $attempt), retrying in 10s"
              sleep 10
            done
            echo "✗ $name failed health check: $url"
            return 1
          }
          probe "backend /health"  "${{ steps.backend.outputs.url }}/health"
          probe "frontend /"       "${{ steps.frontend.outputs.url }}/"

      - name: Summary
        run: |
          {
            echo "### Development deploy complete :rocket:"
            echo ""
            echo "- **Project:** \`${{ vars.GCP_PROJECT_ID }}\`"
            echo "- **Backend:** ${{ steps.backend.outputs.url }}"
            echo "- **Frontend:** ${{ steps.frontend.outputs.url }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Regression: Billion Godson audit against the live DEV app (OPT-IN) ───
  # Runs after the dev deploy ONLY when the pushed commit message contains
  # `[regression]` — it's opt-in so it doesn't spend a real Anthropic audit on
  # every branch push. Drives the deployed dev frontend in headless Chromium
  # through a full Auto-Audit and asserts the verdict (frontend/test/
  # regression.mjs). Informational: it does not block the dev deploy or the prod
  # merge; read the verdict before you promote.
  #
  # Costs one real Anthropic audit (web search + thinking) per run.
  #
  # Set the EXPECTED_VERDICT repo variable to the known-good Billion Godson
  # verdict to enforce an exact match; until then the job runs in sanity mode
  # (asserts a real verdict rendered) and prints the actual verdict to lock in.
  regression:
    name: Dev regression (Billion Godson)
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && contains(github.event.head_commit.message, '[regression]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # regression.mjs imports only `playwright` — no other frontend deps, so
      # install it ad-hoc (--no-save) rather than running the full npm ci.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm i -D --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run Billion Godson regression against dev
        working-directory: frontend
        env:
          FRONTEND_URL: ${{ needs.deploy-dev.outputs.frontend_url }}
          EXPECTED_VERDICT: ${{ vars.EXPECTED_VERDICT }}
        run: node test/regression.mjs

  # ── Rollback: manual only (workflow_dispatch) ────────────────────────────
  # Cloud Run keeps every revision; this reroutes 100% of traffic to a prior
  # one without rebuilding. With no `revision` input, it targets the second-
  # newest ready revision per selected service (the one live before the last
  # deploy). Trigger from Actions → CI/CD Pipeline → Run workflow.
  rollback:
    name: Rollback Cloud Run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify deploy configuration is present
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
        run: |
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID repo variable}"
          : "${GCP_REGION:?Set the GCP_REGION repo variable}"
          : "${GCP_WIF_PROVIDER:?Set the GCP_WIF_PROVIDER repo variable}"
          : "${GCP_DEPLOY_SA:?Set the GCP_DEPLOY_SA repo variable}"

      - name: Authenticate to Google Cloud (keyless / WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Roll back traffic
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_REVISION" ] && [ "$INPUT_SERVICE" = "both" ]; then
            echo "A specific revision requires a single service (backend or frontend), not 'both'." >&2
            exit 1
          fi

          case "$INPUT_SERVICE" in
            backend)  services="$BACKEND_SERVICE" ;;
            frontend) services="$FRONTEND_SERVICE" ;;
            both)     services="$BACKEND_SERVICE $FRONTEND_SERVICE" ;;
            *) echo "Unknown service: $INPUT_SERVICE" >&2; exit 1 ;;
          esac

          for svc in $services; do
            if [ -n "$INPUT_REVISION" ]; then
              target="$INPUT_REVISION"
            else
              # Second-newest ready revision = the one serving before the last deploy.
              target=$(gcloud run revisions list \
                --service "$svc" \
                --project "${{ vars.GCP_PROJECT_ID }}" \
                --region "${{ vars.GCP_REGION }}" \
                --format 'value(metadata.name)' \
                --sort-by '~metadata.creationTimestamp' \
                --limit 2 | sed -n '2p')
            fi
            if [ -z "$target" ]; then
              echo "No prior revision found for $svc — nothing to roll back to." >&2
              exit 1
            fi
            echo "Rolling $svc back to $target"
            gcloud run services update-traffic "$svc" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --region "${{ vars.GCP_REGION }}" \
              --to-revisions "$target=100"
            echo "- **$svc** → \`$target\`" >> "$GITHUB_STEP_SUMMARY"
          done
